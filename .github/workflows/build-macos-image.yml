name: Build Full Installer ISO/DMG image

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: "Choose a macOS version to build."
        required: true
        type: choice
        options:
          - ''
          - 'Tahoe'
          - 'Sequoia'
          - 'Sonoma'
          - 'Ventura'
          - 'Monterey'
          - 'Big Sur'
          - 'Catalina'
          - 'Mojave'
          - 'High Sierra'
          - 'Sierra'
          - 'El Capitan'
          - 'Yosemite'
          - 'Mavericks'
          - 'Mountain Lion'
          - 'Lion'
      image_format:
        description: "Choose 'iso' for virtual machines, 'dmg' for flash to USB drive."
        required: true
        type: choice
        options:
          - ''
          - 'iso'
          - 'dmg'

jobs:
  build-macos-image:
    if: ${{ inputs.macos_version != '' && inputs.image_format != '' }}
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: System Information
        run: |
          echo "Runner OS: $(sw_vers -productName) $(sw_vers -productVersion)"
          echo "Architecture: $(uname -m)"
          echo ""
          df -h $(mktemp)
          echo ""
          echo "RAM: $(top -l 1 | grep PhysMem)"
          echo ""
          echo "CPU: $(sysctl -n machdep.cpu.brand_string)"

      - name: Create macOS image
        id: create_image
        run: |
          ./mkmaciso "${{ inputs.macos_version }}" "${{ inputs.image_format }}"
          if [ "${{ inputs.image_format }}" == "iso" ]; then
            echo "image_name=$(basename *.iso)" >> $GITHUB_OUTPUT
          else
            echo "image_name=$(basename *.dmg.img)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.create_image.outputs.image_name }}
          compression-level: 0
          retention-days: 15
          archive: false

      - name: Split and upload to GoFile
        if: ${{ steps.create_image.outcome == 'success' }}
        env:
          GOFILE_API_KEY: ${{ secrets.GOFILE_API_KEY }}
        run: |
          set -u   # (no -e: a single bad part must not kill the rest)
          IMG="${{ steps.create_image.outputs.image_name }}"
          echo "Built image: $IMG ($(du -h "$IMG" | cut -f1))"

          mkdir -p parts
          split -b 9500m -d -a 2 "$IMG" "parts/${IMG}.part"
          ls -lh parts/

          # no jq on the runner -> parse the gofile server/link with sed
          SERVER=$(curl -s https://api.gofile.io/servers | sed -n 's/.*"name":"\([a-z0-9-]*\)".*/\1/p' | head -1)
          [ -n "$SERVER" ] || SERVER=store9
          echo "GoFile server: $SERVER"

          for p in parts/*; do
            echo "Uploading $p ..."
            RESP=$(curl -s --retry 5 --retry-all-errors \
              ${GOFILE_API_KEY:+-H "Authorization: Bearer ${GOFILE_API_KEY}"} \
              -F "file=@${p}" \
              "https://${SERVER}.gofile.io/uploadFile")
            echo "$RESP"
            LINK=$(echo "$RESP" | sed -n 's/.*"downloadPage":"\([^"]*\)".*/\1/p')
            echo "GOFILE_LINK :: $(basename "$p") :: ${LINK:-FAILED}"
          done

      - name: Summary
        if: always()
        run: |
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }

          if [ "${{ steps.create_image.outcome }}" == "failure" ]; then
            sum "## Download macOS failed" \
                "" \
                "> [!WARNING]" \
                "> This runner may have network issues. Please **re-run the workflow** to try a different runner."
          elif [ "${{ job.status }}" == "success" ]; then
            if [ "${{ inputs.image_format }}" == "iso" ]; then
              sum "## Successfully built $(basename *.iso)" \
                  "" \
                  "> [!Important]" \
                  "> This ISO image is intended for creating macOS virtual machines on Proxmox VE, QEMU, and VMware."
            else
              sum "## Successfully built $(basename *.dmg.img)" \
                  "" \
                  "> [!Important]" \
                  '> This DMG image is intended for flashing to USB drive using [Rufus](https://rufus.ie/en/#download) *(Windows)* or `dd` *(Linux)*.'
            fi
            sum "" \
                "> GoFile part links are printed above in the 'Split and upload to GoFile' step log (GOFILE_LINK lines)."
          fi
